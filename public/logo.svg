<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" fill="none">
  <defs>
    <linearGradient id="logoDeckGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1325"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="logoGoldGrad" x1="0" y1="0" x2="64" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  
  <!-- Emblem Icon Container -->
  <g transform="translate(8, 8)">
    <rect width="64" height="64" rx="14" fill="url(#logoDeckGrad)" />
    <rect x="1" y="1" width="62" height="62" rx="13" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1.5" />
    
    <!-- Architectural Gable / Porch Peak -->
    <path d="M32 9L52 25L47.5 29L32 16.5L16.5 29L12 25L32 9Z" fill="url(#logoGoldGrad)" />
    
    <!-- Top Line Plank -->
    <rect x="14" y="31" width="36" height="5" rx="1.5" fill="url(#logoGoldGrad)" />
    <!-- Plank 2 -->
    <rect x="14" y="38" width="36" height="5" rx="1.5" fill="#E2E8F0" />
    <!-- Plank 3 -->
    <rect x="14" y="45" width="36" height="5" rx="1.5" fill="#94A3B8" />
    <!-- Foundation Pillar -->
    <rect x="30" y="52" width="4" height="4" rx="1" fill="#F59E0B" />
  </g>
  
  <!-- Typography -->
  <g transform="translate(86, 0)">
    <!-- TOP LINE -->
    <text x="0" y="38" font-family="'Outfit', 'Montserrat', 'Inter', sans-serif" font-weight="900" font-size="28" letter-spacing="1.5" fill="#0B1325">
      TOP <tspan fill="#D97706">LINE</tspan>
    </text>
    
    <!-- Gold underline divider rule -->
    <rect x="0" y="45" width="220" height="2" fill="url(#logoGoldGrad)" rx="1" />
    
    <!-- Subtitle: CONSTRUCTION LLC -->
    <text x="0" y="59" font-family="'Inter', sans-serif" font-weight="700" font-size="11.5" letter-spacing="3" fill="#334155">
      CONSTRUCTION LLC
    </text>
    
    <!-- Tagline: CUSTOM DECKS & PORCHES • FUQUAY-VARINA, NC -->
    <text x="0" y="72" font-family="'Inter', sans-serif" font-weight="500" font-size="8.5" letter-spacing="1" fill="#64748B">
      CUSTOM DECKS &amp; PORCHES • FUQUAY-VARINA, NC
    </text>
  </g>
</svg>
