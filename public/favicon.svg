<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="deckGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1325"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="64" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <!-- Rounded Shield / Base -->
  <rect width="64" height="64" rx="14" fill="url(#deckGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1.5" />
  
  <!-- Architectural Gable / Porch Peak -->
  <path d="M32 9L52 25L47.5 29L32 16.5L16.5 29L12 25L32 9Z" fill="url(#goldGrad)" />
  
  <!-- Peak Keystone / Triangle Accent -->
  <polygon points="32,19 36,24 28,24" fill="#FDE68A" />

  <!-- Horizontal Precision Deck Planks ("Top Line") -->
  <!-- Plank 1 (Top Line) with distinctive highlight -->
  <rect x="14" y="31" width="36" height="5" rx="1.5" fill="url(#goldGrad)" />
  <!-- Plank 2 -->
  <rect x="14" y="38" width="36" height="5" rx="1.5" fill="#E2E8F0" fill-opacity="0.9" />
  <!-- Plank 3 -->
  <rect x="14" y="45" width="36" height="5" rx="1.5" fill="#94A3B8" fill-opacity="0.8" />
  
  <!-- Vertical Structural Post Line / Foundation Pillar -->
  <rect x="30" y="52" width="4" height="4" rx="1" fill="#F59E0B" />
</svg>
